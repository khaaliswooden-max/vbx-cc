name: Publish leadership dashboard

# ============================================================
# Publishes the VBX Command Center dashboard to GitHub Pages so
# internal leadership can open ONE link and have it auto-update.
#
# Owner-authorized 2026-06-05 (Khaalis Wooden) as an explicit
# override of CLAUDE.md Hard Rules #1 and #7. See CLAUDE.md §5.
#
# DATA SENSITIVITY — the served workbook is, in order of preference:
#   1. data/leadership_feed.xlsx       (sanitized / aggregate feed, committed)
#   2. VBX_Command_Center_v1.1.xlsx    (FULL workbook — raw partner /
#                                       NDA / revenue detail, PUBLIC)
# To publish a redacted view, commit data/leadership_feed.xlsx and
# it is used automatically — no workflow change required.
#
# Either way the copy that reaches _site is passed through
# scripts/build_leadership_feed.py first, which applies the disclosure
# allowlist: it publishes the technical half of Opportunity_Detail (scope,
# capabilities, LCATs, compliance gates, place/period of performance, response
# due) and withholds the BD half, and it withholds Pipeline!J (Notes) entirely —
# ~21k characters of internal capture prose that had been served publicly until
# 2026-08-28. The committed workbook is never modified.
#
# The policy is an ALLOWLIST, so a column added later is withheld by default
# rather than published by omission. The build fails, writing no output, if:
#   * a cell outside the allowlist survives,
#   * a withheld value appears anywhere in the package bytes, or
#   * a Hard Rule #8 term appears anywhere in the package (no exception exists).
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/VBX_Command_Center_Dashboard.html'
      - 'dashboard/vendor/**'
      - 'VBX_Command_Center_v1.1.xlsx'
      - 'data/leadership_feed.xlsx'
      - 'scripts/build_leadership_feed.py'
      - 'scripts/pipeline_feed.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "openpyxl>=3.1.2,<4.0.0"

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Dashboard becomes the site index.
          cp dashboard/VBX_Command_Center_Dashboard.html _site/index.html
          # Vendored SheetJS — served same-origin so the dashboard has no
          # third-party runtime dependency (the page loads vendor/xlsx.full.min.js).
          mkdir -p _site/vendor
          cp dashboard/vendor/xlsx.full.min.js _site/vendor/xlsx.full.min.js
          # Co-locate the workbook so the dashboard's same-origin
          # relative fetch ('VBX_Command_Center_v1.1.xlsx') resolves.
          if [ -f data/leadership_feed.xlsx ]; then
            echo "Publishing sanitized feed: data/leadership_feed.xlsx"
            SOURCE_WORKBOOK=data/leadership_feed.xlsx
          elif [ -f VBX_Command_Center_v1.1.xlsx ]; then
            echo "::warning::Publishing FULL workbook (raw partner/NDA/revenue data) publicly."
            SOURCE_WORKBOOK=VBX_Command_Center_v1.1.xlsx
          else
            echo "::error::No workbook found to publish."
            exit 1
          fi
          # Apply the disclosure allowlist on the way out. Writes no output and
          # exits non-zero if anything outside the allowlist survives.
          python scripts/build_leadership_feed.py "$SOURCE_WORKBOOK" _site/VBX_Command_Center_v1.1.xlsx
          # Independent check on the artifact about to ship: Hard Rule #8 names
          # must never reach a served file. The builder already enforces this;
          # repeating it here means a change to the builder cannot quietly
          # disarm the deploy gate. sys.exit(<str>) prints and exits non-zero.
          python -c "import zipfile, sys; z = zipfile.ZipFile('_site/VBX_Command_Center_v1.1.xlsx'); blob = b''.join(z.read(n) for n in z.namelist()).decode('utf-8', 'ignore'); hits = [t for t in ('CAHSP', 'GRHD') if t in blob]; sys.exit(f'::error::Hard Rule #8 term(s) {hits} present in the published workbook. Refusing to deploy.' if hits else 0)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
